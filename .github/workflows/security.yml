name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  sast-secrets-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
      - run: python -m pip install --disable-pip-version-check semgrep==1.176.1 pip-audit==2.10.1 uv==0.10.2
      # exclude-rule: usamos `exclude-newer` con fecha absoluta en pyproject.toml
      # (reproducible entre máquinas); la regla solo acepta duraciones relativas.
      - run: >-
          semgrep scan --config p/python --config p/owasp-top-ten --error
          --exclude-rule package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
          apps/api
      - run: uv export --project apps/api --frozen --no-dev --format requirements-txt --output-file /tmp/requirements.txt
      - run: pip-audit --requirement /tmp/requirements.txt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create build-only environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=motorscope
          POSTGRES_USER=motorscope
          POSTGRES_PASSWORD=build-only-password
          REDIS_PASSWORD=build-only-password
          DATABASE_URL=postgresql+psycopg://motorscope:build-only-password@postgres:5432/motorscope
          REDIS_URL=redis://:build-only-password@redis:6379/0
          CORS_ORIGINS=["http://localhost"]
          ALLOWED_HOSTS=["localhost","api","web"]
          SESSION_COOKIE_SECURE=false
          CADDY_SITE_ADDRESS=http://localhost
          EOF
      - run: docker compose build api web
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motorscope-api
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motorscope-web
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
