[project]
name = "motorscope-api"
version = "0.1.0"
description = "API y worker del monolito modular MotorScope"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.2",
  "dramatiq[redis]==2.2.1",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "psycopg[binary,pool]==3.3.5",
  "pwdlib[argon2]==0.3.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "redis==8.1.0",
  "sqlalchemy==2.0.52",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
  "testcontainers==4.15.0",
]

[tool.uv]
package = false
# `copy` en lugar de hardlink/symlink: el recurso de red UNC de desarrollo no
# admite enlaces (ADR-0011, riesgo R-08).
link-mode = "copy"
# Cooldown de cadena de suministro (Semgrep uv-missing-dependency-cooldown): no
# resolver versiones publicadas después de esta fecha. Súbela al regenerar el lock.
exclude-newer = "2026-09-06T00:00:00Z"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["dramatiq.*", "prometheus_client.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict = true
markers = [
  "unit: no external infrastructure",
  "integration: requires PostgreSQL and Redis",
]
addopts = [
  "--strict-markers",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
